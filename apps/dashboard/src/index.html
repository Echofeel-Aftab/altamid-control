<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Altamid Control</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#103860">
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script>
      try {
        if (localStorage.getItem('altamid_control_theme') === 'dark') {
          document.documentElement.classList.add('theme-dark');
        }
        if (localStorage.getItem('altamid_control_sidebar') === '1' && window.matchMedia('(min-width: 992px)').matches) {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
